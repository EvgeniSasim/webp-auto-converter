name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax check
        run: |
          php -l privaro-webp-auto-converter/privaro-webp-auto-converter.php
          php -l privaro-webp-auto-converter/uninstall.php
          php -l privaro-webp-auto-converter/includes/image-helpers.php
          php -l privaro-webp-auto-converter/includes/auto-output.php

      - name: Verify readme version match
        run: |
          PHP_VERSION=$(grep 'Version:' privaro-webp-auto-converter/privaro-webp-auto-converter.php | awk '{print $NF}')
          README_TAG=$(grep 'Stable tag:' privaro-webp-auto-converter/readme.txt | awk '{print $NF}')
          test "${PHP_VERSION}" = "${README_TAG}"

      - name: Build release zip
        run: bash scripts/build-release.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: privaro-webp-auto-converter-zip
          path: build/privaro-webp-auto-converter.zip
